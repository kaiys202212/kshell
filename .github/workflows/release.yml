name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip: kshell-desktop-windows-amd64.zip
            artifact: win-amd64
          - os: ubuntu-latest
            zip: kshell-desktop-linux-amd64.zip
            artifact: linux-amd64
          - os: macos-latest
            zip: kshell-desktop-darwin-arm64.zip
            artifact: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zip libgtk-3-dev libayatana-appindicator3-dev
          # Wails v2.16 默认链 webkit2gtk-4.0；Ubuntu 24+ 只有 4.1，需 -tags webkit2_41
          if sudo apt-get install -y libwebkit2gtk-4.0-dev; then
            echo "WEBKIT_TAG=" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y libwebkit2gtk-4.1-dev
            echo "WEBKIT_TAG=-tags webkit2_41" >> "$GITHUB_ENV"
          fi
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build and pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZIP_NAME: ${{ matrix.zip }}
          VERSION: ${{ github.ref_name }}
        run: |
          $ver = $env:VERSION
          $zipName = $env:ZIP_NAME
          .\build.ps1 -Desktop -Version $ver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item dist/pkg -ItemType Directory -Force | Out-Null
          Copy-Item dist\kshell-desktop.exe dist\pkg\kshell-desktop.exe
          $zipPath = Join-Path dist $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path dist\pkg\kshell-desktop.exe -DestinationPath $zipPath
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $zipName`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/SHA256SUMS'), $line, [System.Text.UTF8Encoding]::new($false))
      - name: Build and pack (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ github.ref_name }}
          ZIP_NAME: ${{ matrix.zip }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          # bash 不会把 wails 的 stderr 进度当成失败；pwsh 在 GHA 上会
          wails build ${WEBKIT_TAG:-} -ldflags "-X github.com/yangk/kshell/internal/version.Version=${VERSION}"
          mkdir -p dist/pkg
          # macOS：必须打整包 .app（energye/systray 依赖 AppKit/NSBundle）；裸 Mach-O 会 SIGTRAP。
          # Linux：仍为顶层裸二进制 kshell-desktop。
          if [ -d build/bin/kshell.app ]; then
            rm -rf dist/pkg/kshell-desktop.app
            cp -R build/bin/kshell.app dist/pkg/kshell-desktop.app
            chmod +x dist/pkg/kshell-desktop.app/Contents/MacOS/kshell
            (cd dist/pkg && zip -ry "../${ZIP_NAME}" kshell-desktop.app)
          elif [ -e build/bin/kshell ]; then
            cp build/bin/kshell dist/kshell-desktop
            chmod +x dist/kshell-desktop
            cp dist/kshell-desktop dist/pkg/kshell-desktop
            (cd dist/pkg && zip -r "../${ZIP_NAME}" kshell-desktop)
          else
            find build/bin -type f -print || true
            echo "找不到 Wails 产物" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null; then
            HASH=$(sha256sum "dist/${ZIP_NAME}" | awk '{print $1}')
          else
            HASH=$(shasum -a 256 "dist/${ZIP_NAME}" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$HASH" "${ZIP_NAME}" > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.zip }}
            dist/SHA256SUMS

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -print
          find artifacts -type f -name '*.zip' -exec cp -v {} dist/ \;
          find artifacts -type f -name SHA256SUMS -exec cat {} \; > dist/SHA256SUMS
          ls -la dist
          cat dist/SHA256SUMS
          test -s dist/SHA256SUMS
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          # 重打同名 tag 时旧 Release 常已随 tag 删除；create 失败再 upload。
          # --latest 让升级检查打到本 tag（即使仓库里还有更高号的旧 tag）。
          if ! gh release create "$TAG" --latest --title "$TAG" --notes "kshell $TAG" dist/*.zip dist/SHA256SUMS; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
            gh release edit "$TAG" --latest
          fi
      - name: Sync GitCode release
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: abraveheart2023
          GITCODE_REPO: kshell
          TAG: ${{ github.ref_name }}
        run: go run ./cmd/syncgitcode -dir dist -tag "$TAG"
