<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script>
    (function () {
      try {
        var saved = null;
        try { saved = localStorage.getItem('kshell-appearance'); } catch (e) {}
        var dark = saved ? saved === 'dark'
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var fsRaw = null;
        try { fsRaw = localStorage.getItem('kshell-font-size'); } catch (e) {}
        var n = fsRaw ? parseInt(fsRaw, 10) : 13;
        if (!n || n !== n || n <= 0) n = 13;
        else if (n < 10) n = 10;
        else if (n > 20) n = 20;
        document.documentElement.style.setProperty('--app-font-size', n + 'px');
        document.documentElement.style.fontSize = (16 * n / 13) + 'px';
      } catch (e) {}
    })();
  </script>
  <title>kshell</title>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
